name: Validate proposed CustomVibe changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: customvibe-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 22 build and fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Build storefront and server-rendered pages
        run: npm run build
      - name: Build admin and storefront preview
        run: npm run build:admin
      - name: Verify shipped third-party notices
        run: node scripts/check-dependency-notices.mjs --outputs --bundles
      - name: Run local fixture tests
        run: npm test
        env:
          CV_CHECK_BUILT_NOTICES: '1'
      - name: Run Python security-helper fixtures
        run: python3 -B -m unittest discover tests/python
