name: Publish protected CustomVibe site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_admin:
        description: Also publish the existing business admin Worker
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: customvibe-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'TIMMMYYYHHHH/Customvibev3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run build:admin
      - run: npm test
      - name: Verify destination before publishing
        run: node scripts/check-deployment.mjs before
        env:
          CLOUDFLARE_ACCOUNT_ID: 4f57d4e924674cb87b33d4c884745cf6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUSTOMVIBE_PAGES_DEPLOY_TOKEN }}
      - name: Publish to protected Pages project
        run: npx --no-install wrangler pages deploy dist/client --project-name customvibe-business --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: 4f57d4e924674cb87b33d4c884745cf6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUSTOMVIBE_PAGES_DEPLOY_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Publish existing business admin Worker when requested
        if: github.event_name == 'workflow_dispatch' && inputs.publish_admin
        run: |
          node scripts/check-admin-deployment.mjs
          npx --no-install wrangler deploy --config wrangler.admin.jsonc
          node scripts/check-admin-deployment.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: 4f57d4e924674cb87b33d4c884745cf6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUSTOMVIBE_PAGES_DEPLOY_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify protection after publishing
        run: node scripts/check-deployment.mjs after
        env:
          CLOUDFLARE_ACCOUNT_ID: 4f57d4e924674cb87b33d4c884745cf6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUSTOMVIBE_PAGES_DEPLOY_TOKEN }}
