name: Publish protected CustomVibe site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed 40-character main commit (must still be current main)
        type: string
        required: true
      publish_admin:
        description: Also publish admin when change classification does not already require it
        type: boolean
        default: false
      release_evidence_json:
        description: Optional sanitized baseline/prerequisite record; omit to reuse the last workflow artifact
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: customvibe-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'TIMMMYYYHHHH/Customvibev3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: 4f57d4e924674cb87b33d4c884745cf6
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run build:admin
      - run: npm test
      - name: Build private-service comparison bundles without credentials or publication
        run: node scripts/release-manifest.mjs private-builds
      - name: Record source, current versions and compatible prerequisites
        id: release_plan
        run: node scripts/release-manifest.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUSTOMVIBE_PAGES_DEPLOY_TOKEN }}
          PUBLISH_ADMIN: ${{ inputs.publish_admin }}
          RELEASE_EVIDENCE_JSON: ${{ inputs.release_evidence_json }}
      - name: Publish protected Pages from the reviewed build
        run: node scripts/release-manifest.mjs publish pages
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUSTOMVIBE_PAGES_DEPLOY_TOKEN }}
      - name: Publish matching admin when required by the release plan
        if: steps.release_plan.outputs.publish_admin == 'true'
        run: node scripts/release-manifest.mjs publish admin
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUSTOMVIBE_PAGES_DEPLOY_TOKEN }}
      - name: Verify paired versions and protection
        run: node scripts/release-manifest.mjs finish
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CUSTOMVIBE_PAGES_DEPLOY_TOKEN }}
      - name: Preserve complete or incomplete release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-${{ github.run_id }}
          path: |
            dist/release/build-manifest.json
            dist/release/release-manifest.json
          if-no-files-found: warn
          retention-days: 90
