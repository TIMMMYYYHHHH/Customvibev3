<!doctype html><html lang="en"><meta charset="utf-8"><title>Artwork export check</title><h1>Artwork export check</h1><pre id="result">Checking…</pre><script type="module">
import {loadImage,makePhoto,renderPhoto} from '../../src/artwork.js';
import {prepareOrderItems} from '../../src/order-artwork.mjs';
import {validateOrder} from '../../server/submission-model.mjs';
import {defaultContent} from '../../src/content/model.mjs';
try {
 const src='/assets/brand-icon.png',img=await loadImage(src),results=[];
 for(const gridSize of [1,3,5]){
  const photo={...makePhoto(src,'Public brand icon',img.naturalWidth,img.naturalHeight),format:gridSize===1?'photo':'puzzle',gridSize};
  const preview=await renderPhoto(photo,{puzzle:gridSize>1,gridSize});
  const basket=[{kind:gridSize===1?'photo':'puzzle',qty:1,sourceId:photo.id,gridSize,preview:preview.url}];
  const items=await prepareOrderItems(basket,[photo],renderPhoto);
  const order=validateOrder({id:crypto.randomUUID(),createdAt:Math.floor(Date.now()/1000),contact:{name:'Test',email:'test@example.com',phone:'0821234567'},locker:{name:'Test preference',area:'Durban'},consent:true,items},defaultContent);
  results.push({format:gridSize===1?'photo':gridSize+' x '+gridSize,files:items[0].files.length,magnetQty:order.magnetQty,passed:true});
 }
 document.querySelector('#result').textContent=JSON.stringify(results,null,2);
}catch{document.querySelector('#result').textContent='FAILED: exported artwork did not pass validation';}
</script></html>
