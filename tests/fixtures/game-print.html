<!doctype html><html lang="en"><meta charset="utf-8"><title>Offline game print verification</title><style>body{font:16px system-ui;background:#fffdf8;color:#291438}#masters{display:grid;grid-template-columns:repeat(5,150px);gap:12px}img{width:150px}pre{white-space:pre-wrap}</style><h1>Offline game print verification</h1><p>No orders or emails are submitted.</p><pre id="result">Preparing the ten print files…</pre><div id="masters"></div><script type="module">
import {defaultContent} from '/src/content/model.mjs';
import {preparePrivateArtwork} from '/src/order-artwork.mjs';
import {validateOrder} from '/server/submission-model.mjs';
const run=async()=>{const item={id:'11111111-1111-4111-8111-111111111111',kind:'noughts-crosses',qty:1,printVersion:1};const prepared=await preparePrivateArtwork([item],[],null,defaultContent);let dimensions=[];for(const bytes of prepared.uploads){const blob=new Blob([bytes],{type:'image/jpeg'});const image=new Image();image.src=URL.createObjectURL(blob);await image.decode();dimensions.push([image.naturalWidth,image.naturalHeight]);document.querySelector('#masters').append(image)}const order=validateOrder({id:'22222222-2222-4222-8222-222222222222',createdAt:Math.floor(Date.now()/1000),contact:{name:'Fixture',email:'fixture@example.com',phone:'0123456789'},locker:{name:'Locker',area:'Durban'},consent:true,items:prepared.items},defaultContent,true);document.querySelector('#result').textContent=JSON.stringify({files:prepared.uploads.length,dimensions,magnetQty:order.magnetQty,subtotalCents:order.subtotalCents,uniqueFaces:new Set(prepared.items[0].files.map(f=>f.sha256)).size,paymentStatus:order.paymentStatus},null,2)};run().catch(e=>document.querySelector('#result').textContent=e.stack);
</script></html>
